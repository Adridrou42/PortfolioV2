<!DOCTYPE html>
<html lang="fr">
<link rel="stylesheet" href="../CSS/style.css">
	<head>
		<meta charset="UTF-8">
	</head>
	<body class="contact page">
		<header class="B06">CONTACT</header>


		<!-- Utilisation de EmailJS  -->
		<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
		<script>
			(function(){
				emailjs.init("uCPIP5yiMWEWBPVpB"); // Clef API publique
			})();
		</script>
			

		<section class="u01">
			<article>
				<form id="contact-form" class="form">
					<input type="text" name="nom" placeholder="Nom" tabindex="1" required>
					<input type="text" name="prenom" placeholder="Prénom" tabindex="2" required>
					<input type="mail" name="courriel" placeholder="Courriel" tabindex="3" required>
					<input type="tel" name="tel" placeholder="Téléphone" tabindex="4" required>
					<br>
					<input  class="message" type="text" name="objet" placeholder="Objet" tabindex="5" required><br>
					<textarea class="message" name="message" placeholder="Votre message..." rows="5" tabindex="6" required></textarea><br>

					<input type="submit" value="Envoyer" tabindex="7" class="button">
				</form>
			</article>
		</section>	

		<section class="u02">
			<article>
				<article>
					<h2>Courriel</h2>
					<p>adycabanel@gmail.com</p>
				</article>
				<article>
					<h2>Numéro de téléphone</h2>
					<p>07 48 61 52 38</p>
				</article>
			</article>
		</section>



		<script>
			function isValidEmail(email) {
				return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
			}

			function isValidPhone(phone) {
				return /^(?:\+33|0)[1-9](?:[\s.-]?\d{2}){4}$/.test(phone);
			}

			document.getElementById("contact-form").addEventListener("submit", function(e) {
				e.preventDefault();

				const email = this.courriel.value.trim();
				const phone = this.tel.value.trim();

				if (!isValidEmail(email)) {
					alert("Adresse de courriel invalide.");
					return;
				}

				if (!isValidPhone(phone)) {
					alert("Numéro de téléphone invalide.");
					return;
				}

				emailjs.sendForm("portfolio","template_5vt02dd",this)
				.then(
					function()
						{alert("Email envoyé avec succès !");},
					function(error)
						{alert("Erreur : " + error.text);}
				);
			});
		</script>

	</body>
</html>
